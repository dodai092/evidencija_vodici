<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page-2025 Refactor Test</title>
  <link rel="stylesheet" href="guides.css">
</head>
<body>
  <!-- Minimal nav for theme toggle and date picker -->
  <div class="nav" style="margin-bottom: 0">
    <div class="nav-actions">
      <button id="theme-toggle" class="theme-toggle-icon" onclick="toggleTheme()">◐</button>
      <input id="cutoff-picker" type="date" class="date-picker-ui"
             value="2026-05-06" onchange="updateDateAsOf(this.value)">
    </div>
  </div>

  <!-- Empty container — will be populated by Page25.init() -->
  <div id="page-25" class="page active"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="data-2025.js"></script>
  <script src="shared.js"></script>
  <script src="page-2025.js"></script>
  <script>
    console.log('Loaded with refactored page-2025.js');
    // Simulate what showPage() normally does:
    document.addEventListener('DOMContentLoaded', () => {
      PAGES.Page25.init();
    });
  </script>
</body>
</html>
